<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101919" />
    <meta name="description" content="Nebenkosten und Zählerstände für Ihr Zweifamilienhaus im Blick." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <title>Hausverwaltung | Zweifamilienhaus</title>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="#dashboard" aria-label="Hausverwaltung Startseite">
          <span class="brand-mark" aria-hidden="true">⌂</span>
          <span class="brand-copy"><strong>Hausverwaltung</strong><small>PRIVATES EIGENTUM</small></span>
        </a>
        <nav class="main-nav" id="main-nav">
          <a class="nav-link" href="#dashboard" data-page="dashboard"><span class="nav-icon" aria-hidden="true">◫</span><span>Übersicht</span></a>
          <a class="nav-link" href="#strom" data-page="strom"><span class="nav-icon" aria-hidden="true">ϟ</span><span>Stromzähler</span></a>
          <a class="nav-link" href="#wasser" data-page="wasser"><span class="nav-icon" aria-hidden="true">◌</span><span>Wasserzähler</span></a>
          <a class="nav-link" href="#nebenkosten" data-page="nebenkosten"><span class="nav-icon" aria-hidden="true">▤</span><span>Nebenkosten</span></a>
          <a class="nav-link" href="#verteilung" data-page="verteilung"><span class="nav-icon" aria-hidden="true">⇄</span><span>Verteilung</span></a>
        </nav>
        <div class="sidebar-property">
          <span class="property-dot"></span>
          <span><strong>Zweifamilienhaus</strong><small>2 Wohneinheiten</small></span>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>IMMOBILIEN</span><span class="breadcrumb-slash">/</span><strong id="page-title">Übersicht</strong></div>
          <div class="topbar-actions">
            <span class="save-status" id="save-status"><span class="status-dot"></span> Lokal gespeichert</span>
            <button class="icon-button install-button" id="install-button" type="button" aria-label="App installieren" title="App installieren" hidden><span aria-hidden="true">⇩</span></button>
            <span class="avatar" aria-label="Hausverwaltung">HV</span>
          </div>
        </header>
        <section class="page-content" id="page-content" aria-live="polite"></section>
        <footer class="app-footer"><span>HAUSVERWALTUNG</span><span>Stand: <time id="today"></time></span></footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
